<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="face" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f8b8cc"/>
      <stop offset="100%" stop-color="#e88da5"/>
    </radialGradient>
    <radialGradient id="snout" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f5d0d8"/>
      <stop offset="100%" stop-color="#f0b8c8"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#d87a95"/>
  <!-- Ears -->
  <ellipse cx="130" cy="100" rx="65" ry="75" fill="#e88da5" transform="rotate(-15 130 100)"/>
  <ellipse cx="130" cy="105" rx="40" ry="50" fill="#d06a85" transform="rotate(-15 130 105)"/>
  <ellipse cx="382" cy="100" rx="65" ry="75" fill="#e88da5" transform="rotate(15 382 100)"/>
  <ellipse cx="382" cy="105" rx="40" ry="50" fill="#d06a85" transform="rotate(15 382 105)"/>
  <!-- Face -->
  <circle cx="256" cy="270" r="200" fill="url(#face)"/>
  <!-- Eyes -->
  <ellipse cx="190" cy="230" rx="28" ry="32" fill="#2a1520"/>
  <ellipse cx="322" cy="230" rx="28" ry="32" fill="#2a1520"/>
  <!-- Eye shine -->
  <ellipse cx="200" cy="218" rx="12" ry="14" fill="white" opacity="0.7"/>
  <ellipse cx="332" cy="218" rx="12" ry="14" fill="white" opacity="0.7"/>
  <!-- Snout -->
  <ellipse cx="256" cy="330" rx="80" ry="55" fill="url(#snout)"/>
  <!-- Nostrils -->
  <ellipse cx="228" cy="335" rx="18" ry="22" fill="#c06880"/>
  <ellipse cx="284" cy="335" rx="18" ry="22" fill="#c06880"/>
  <!-- Mouth -->
  <path d="M 220 375 Q 256 400 292 375" stroke="#c06880" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <ellipse cx="140" cy="310" rx="35" ry="25" fill="#e87090" opacity="0.3"/>
  <ellipse cx="372" cy="310" rx="35" ry="25" fill="#e87090" opacity="0.3"/>
</svg>
